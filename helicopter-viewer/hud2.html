<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Attack Helicopter Concept Viewer</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111318; }
  #info {
    position: fixed; top: 10px; left: 10px; color: #cfd6e4;
    font: 13px/1.4 system-ui, sans-serif; z-index: 10; pointer-events: none;
    text-shadow: 0 1px 2px rgba(0,0,0,0.8);
  }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #cfd6e4; font: 16px system-ui, sans-serif; background: #111318; z-index: 20;
  }
</style>
</head>
<body>
<div id="loading">Loading model...</div>
<div id="info">
  attack_helicopter_concept.glb — drag to orbit, scroll to zoom<br/>
  <span id="animInfo"></span>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.164.1/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

// This GLB stores every material's base color via the deprecated
// KHR_materials_pbrSpecularGlossiness extension, which GLTFLoader doesn't
// understand and silently drops — so every mesh loses its diffuse
// texture/color and falls back to a flat gray, relying only on whatever
// proper emissiveTexture happens to still be layered on top. This function
// manually parses the GLB's JSON + BIN chunks, recovers each material's
// diffuseTexture/diffuseFactor from the raw extension data, and returns
// everything needed to patch the loaded three.js materials afterward.
async function recoverSpecGlossData(url) {
  const buf = await fetch(url).then((r) => r.arrayBuffer());
  const dv = new DataView(buf);
  let offset = 12;
  let json = null;
  let binChunk = null;
  while (offset < buf.byteLength) {
    const chunkLength = dv.getUint32(offset, true);
    const chunkType = dv.getUint32(offset + 4, true);
    const chunkData = buf.slice(offset + 8, offset + 8 + chunkLength);
    if (chunkType === 0x4e4f534a) json = JSON.parse(new TextDecoder().decode(chunkData));
    else if (chunkType === 0x004e4942) binChunk = chunkData;
    offset += 8 + chunkLength;
  }

  async function decodeImageForTexture(texIndex) {
    const image = json.images[json.textures[texIndex].source];
    const bv = json.bufferViews[image.bufferView];
    const bytes = binChunk.slice(bv.byteOffset || 0, (bv.byteOffset || 0) + bv.byteLength);
    const blob = new Blob([bytes], { type: image.mimeType });
    return createImageBitmap(blob);
  }

  const byMaterialName = {};
  await Promise.all(
    (json.materials || []).map(async (mat) => {
      const specGloss = mat.extensions && mat.extensions.KHR_materials_pbrSpecularGlossiness;
      if (!specGloss) return;
      const entry = {
        diffuseFactor: specGloss.diffuseFactor || [1, 1, 1, 1],
        glossinessFactor: specGloss.glossinessFactor ?? 1,
      };
      if (specGloss.diffuseTexture) {
        entry.diffuseImage = await decodeImageForTexture(specGloss.diffuseTexture.index);
      }
      byMaterialName[mat.name] = entry;
    })
  );
  return byMaterialName;
}

// Given a decoded diffuse image, detect whether it's a "white-on-transparent
// stencil" (flat white RGB, glyph shapes carried entirely in alpha, as used
// by the HUD screen overlays) vs. a normal color texture, by sampling pixels.
function isWhiteStencil(image) {
  const c = document.createElement("canvas");
  c.width = image.width;
  c.height = image.height;
  const ctx = c.getContext("2d");
  ctx.drawImage(image, 0, 0);
  const { data } = ctx.getImageData(0, 0, c.width, c.height);
  let opaqueSamples = 0;
  let nonWhiteOpaque = 0;
  for (let i = 0; i < data.length; i += 4 * 97) {
    if (data[i + 3] < 10) continue;
    opaqueSamples++;
    if (data[i] < 250 || data[i + 1] < 250 || data[i + 2] < 250) nonWhiteOpaque++;
  }
  return opaqueSamples > 0 && nonWhiteOpaque / opaqueSamples < 0.05;
}

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050608);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(4, 3, 6);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.6,   // strength
  0.4,   // radius
  0.85   // threshold — only truly bright/emissive pixels bloom
);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xffffff, 0x2a2a2a, 0.4));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
dirLight.position.set(5, 10, 7);
scene.add(dirLight);

const grid = new THREE.GridHelper(20, 20, 0x222222, 0x151515);
scene.add(grid);

let mixer = null;
const clock = new THREE.Clock();

const loader = new GLTFLoader();
loader.load(
  "./attack_helicopter_concept.glb",
  (gltf) => {
    const model = gltf.scene;
    scene.add(model);

    // Boost emissive neon trim
    model.traverse((child) => {
      if (child.isMesh && child.material) {
        const materials = Array.isArray(child.material) ? child.material : [child.material];
        materials.forEach((mat) => {
          const isEmissive = mat.emissive && (mat.emissiveMap || mat.emissive.getHex() !== 0x000000);
          if (!isEmissive) return;
          if (mat.name === "HUD1" || mat.name === "HUD2" || mat.name === "HUD3") return;
          mat.emissiveIntensity = Math.max(mat.emissiveIntensity ?? 1, 1.5);
        });
      }
    });

    // Every material in this GLB stores its real base color via the
    // deprecated KHR_materials_pbrSpecularGlossiness extension, which
    // GLTFLoader silently drops. Recover it generically for every affected
    // material — HUD screens, chopper body, rotors, everything.
    const meshesByMaterialName = {};
    model.traverse((child) => {
      if (child.isMesh && child.material) {
        const name = child.material.name;
        (meshesByMaterialName[name] = meshesByMaterialName[name] || []).push(child);
      }
    });

    const hudTint = { HUD1: 0xffaa33, HUD2: 0xffaa33, HUD3: 0x66ffee };

    recoverSpecGlossData("./attack_helicopter_concept.glb").then((byMaterialName) => {
      Object.entries(byMaterialName).forEach(([matName, data]) => {
        const meshes = meshesByMaterialName[matName];
        if (!meshes) return;

        if (data.diffuseImage && isWhiteStencil(data.diffuseImage)) {
          // White-on-transparent stencil (HUD screen glyphs): the shape lives
          // in alpha only, so tint it per-layer instead of drawing it white.
          const tex = new THREE.Texture(data.diffuseImage);
          tex.needsUpdate = true;
          tex.colorSpace = THREE.NoColorSpace;
          const tint = hudTint[matName] ?? 0xffaa33;
          meshes.forEach((mesh) => {
            mesh.material = new THREE.MeshBasicMaterial({
              color: tint,
              alphaMap: tex,
              transparent: true,
              blending: THREE.AdditiveBlending,
              depthWrite: false,
              side: THREE.DoubleSide,
              opacity: 0.65,
            });
          });
          return;
        }

        // Normal base-color recovery: restore the diffuse texture/color as
        // the material's map/color, keeping its existing emissive glow map.
        let tex = null;
        if (data.diffuseImage) {
          tex = new THREE.Texture(data.diffuseImage);
          tex.needsUpdate = true;
          tex.colorSpace = THREE.SRGBColorSpace;
        }
        const [r, g, b] = data.diffuseFactor;
        meshes.forEach((mesh) => {
          const mat = mesh.material;
          if (tex) mat.map = tex;
          mat.color.setRGB(r, g, b);
          // GLTFLoader has no pbrMetallicRoughness block to read here, so it
          // defaulted metalness/roughness to 1/1 (fully metallic + fully
          // rough). With no environment map for specular IBL, that renders
          // near-black. Spec/gloss materials aren't PBR-metallic, so force
          // metalness off and derive roughness from glossinessFactor.
          mat.metalness = 0;
          mat.roughness = 1 - data.glossinessFactor;
          mat.needsUpdate = true;
        });
      });
    });

    // Frame the model in view
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3()).length();
    const center = box.getCenter(new THREE.Vector3());
    controls.target.copy(center);
    camera.position.copy(center).add(new THREE.Vector3(size * 0.6, size * 0.4, size * 0.6));
    camera.near = size / 100;
    camera.far = size * 100;
    camera.updateProjectionMatrix();
    controls.update();

    const animInfo = document.getElementById("animInfo");
    if (gltf.animations && gltf.animations.length > 0) {
      mixer = new THREE.AnimationMixer(model);
      gltf.animations.forEach((clip) => mixer.clipAction(clip).play());
      animInfo.textContent = `Playing ${gltf.animations.length} animation(s): ${gltf.animations.map(a => a.name || "unnamed").join(", ")}`;
    } else {
      animInfo.textContent = "No animations found in this model.";
    }

    document.getElementById("loading").style.display = "none";
  },
  (xhr) => {
    if (xhr.total) {
      const pct = Math.round((xhr.loaded / xhr.total) * 100);
      document.getElementById("loading").textContent = `Loading model... ${pct}%`;
    }
  },
  (error) => {
    console.error("Failed to load GLB:", error);
    document.getElementById("loading").textContent = "Failed to load attack_helicopter_concept.glb";
  }
);

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

renderer.setAnimationLoop(() => {
  const delta = clock.getDelta();
  if (mixer) mixer.update(delta);
  controls.update();
  composer.render();
});
</script>
</body>
</html>
